#env params
env_name:
  - ant
max_episodic_timesteps: 2000
population_size: 8
enable_features: True

#PPO params
actor_lr: 1e-3
value_lr: 1e-3
gamma: 0.99
clip_value: 0.2
n_updates_per_iter: 10
timesteps_per_batch: 20
total_timesteps: 500000
advantage_method: normalized  # gae, normalized, unnormalized
gae_lambda: 0.95

# GNN params
method:
#  - method1
#  - method2
#  - NerveNet
  - EGAT
  - GAT
propagation_steps:
  - 3
#  - 4
#  - 5
#  - 6
node_hidden_size:
#  - 32
  - 64
#  - 128
network_shape:
#  - [64,64]
#  - [128,128]
#  - [254, 254]
  - [64, 64, 64]
morphology_fc_ratio:
#  - 0
#  - .2
#  - .4
  - .5
#  - .6
#  - .8
#  - 1

#misc params
seed: 5

#boring params
save_model_freq: 10

#paths
xml_path: 'environments/assets'
env_dir: './environments'
base_modular_env_path: './environments/modular_env.py'
data_dir: './results'
load_run_path: null
